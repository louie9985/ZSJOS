<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>拍剪工单 · 收件箱原型</title>
<style>
:root{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#14213d;background:#f5f7fb;--line:#e5e9f2;--muted:#718096;--blue:#1677ff;--soft:#eef6ff;--panel:#fff;--shadow:0 8px 24px rgba(28,48,85,.08)}*{box-sizing:border-box}body{margin:0;background:#f5f7fb}.app{height:100vh;display:flex;flex-direction:column}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px}.brand{font-size:19px;font-weight:700}.brand small{display:block;font-size:12px;color:var(--muted);font-weight:400;margin-top:4px}.top-right{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px}.avatar{width:32px;height:32px;border-radius:50%;background:#c8ddff;color:#1454a0;display:grid;place-items:center;font-weight:700}.body{flex:1;min-height:0;display:grid;grid-template-columns:360px 1fr;gap:18px;padding:20px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-height:0}.left{display:flex;flex-direction:column;overflow:hidden}.left-head{padding:18px 18px 12px;border-bottom:1px solid var(--line)}.title{font-size:18px;font-weight:700}.sub{color:var(--muted);font-size:13px;margin-top:6px}.tabs{display:flex;gap:18px;margin-top:18px}.tab{font-size:13px;color:var(--muted);padding-bottom:10px;cursor:pointer}.tab.active{color:var(--blue);font-weight:700;border-bottom:2px solid var(--blue)}.list{padding:10px;overflow:auto}.ticket{padding:15px;border-radius:10px;border:1px solid transparent;margin-bottom:7px;cursor:pointer}.ticket:hover,.ticket.active{background:#f5f9ff;border-color:#bdd8ff}.ticket-top{display:flex;justify-content:space-between;gap:8px}.ticket-no{font-weight:700;font-size:14px}.badge{font-size:11px;padding:3px 8px;border-radius:99px;background:#fff3d9;color:#a96900;white-space:nowrap}.ticket.active .badge{background:#e8f2ff;color:#1766c2}.ticket-meta{display:grid;gap:5px;color:var(--muted);font-size:12px;margin-top:10px}.ticket-meta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.right{padding:24px;overflow:auto}.detail-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding-bottom:18px}.detail-head h1{margin:0;font-size:21px}.detail-head p{margin:7px 0 0;color:var(--muted);font-size:13px}.status{padding:6px 12px;border-radius:99px;background:#fff3d9;color:#a96900;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.fact{background:#f7f9fc;border:1px solid var(--line);border-radius:10px;padding:12px}.fact label{display:block;color:var(--muted);font-size:12px;margin-bottom:7px}.fact b{font-size:14px}.section{border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:16px}.section h2{font-size:15px;margin:0 0 14px}.account{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}.cover{height:104px;border-radius:10px;background:linear-gradient(140deg,#9fd7f5,#5b8cff);display:grid;place-items:center;color:#fff;font-size:26px;font-weight:700;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}.account-info{display:grid;gap:9px;font-size:13px}.account-info span{color:var(--muted);display:inline-block;width:75px}.link{color:var(--blue);text-decoration:none;word-break:break-all}.fields{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.field{padding:12px;background:#f8fafc;border-radius:9px;border:1px solid #edf0f5}.field label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}.field b{font-size:14px;line-height:1.5}.attachment{display:flex;align-items:center;justify-content:space-between;padding:11px 12px;border:1px solid var(--line);border-radius:9px;margin-top:8px}.file{display:flex;gap:9px;align-items:center;font-size:13px}.file-icon{width:28px;height:28px;border-radius:7px;background:#eaf3ff;color:var(--blue);display:grid;place-items:center}.remark{color:#42526e;font-size:13px;line-height:1.7;white-space:pre-wrap}.actions{position:sticky;bottom:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:20px;padding:15px 0 2px;background:linear-gradient(transparent,#fff 18%)}.actions-title{font-size:13px;font-weight:700;margin-right:4px}.btn{border:1px solid #d7deea;background:#fff;border-radius:8px;padding:9px 16px;font-size:13px;cursor:pointer}.btn:hover{border-color:#94bfff;color:var(--blue)}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#d4380d;border-color:#ffccc7;background:#fff1f0}.hint{font-size:12px;color:var(--muted);margin-left:auto}@media(max-width:850px){.body{grid-template-columns:1fr;padding:12px}.left{max-height:42vh}.right{padding:18px}.grid{grid-template-columns:repeat(2,1fr)}.account{grid-template-columns:1fr}.fields{grid-template-columns:1fr}.top{padding:0 16px}.hint{width:100%;margin-left:0}}
</style>
</head>
<body>
<div class="app"><header class="top"><div class="brand">拍剪工单<small>剪辑 / 拍摄统一工作台</small></div><div class="top-right"><span>运营中心</span><span class="avatar">林</span></div></header><main class="body"><aside class="panel left"><div class="left-head"><div class="title">工单收件箱</div><div class="sub">共 12 条 · 点击左侧查看完整详情</div><nav class="tabs"><span class="tab active">我的工单</span><span class="tab">待接单</span><span class="tab">公共池</span></nav></div><div class="list" id="list"></div></aside><section class="panel right" id="detail"></section></main></div>
<script>
const tickets=[{no:'PT-20260922-018',student:'王同学',account:'小王的成长记录',submitter:'运营·林老师',deadline:'2026-09-25 18:00',status:'制作中',cover:'王',platform:'小红书',link:'https://www.xiaohongshu.com/user/profile/64xxxx',fields:[['作品名','30岁转行后，我如何重新开始'],['时长要求','60-90 秒'],['风格要求','真实、克制、有成长感'],['画面要求','生活化，突出人物状态'],['字幕要求','重点句加粗突出'],['钩子要求','前 3 秒提出冲突']],remark:'请剪辑完成后先确认视频已发送给运营，再提交成品。',file:'运营脚本与参考素材.zip'},{no:'PT-20260922-017',student:'陈同学',account:'陈老师说职场',submitter:'运营·周老师',deadline:'2026-09-24 12:00',status:'待验收',cover:'陈',platform:'抖音',link:'https://www.douyin.com/user/7xxxx',fields:[['作品名','普通人如何找到自己的优势'],['时长要求','45-60 秒'],['风格要求','节奏明快，口语化'],['画面要求','正面半身，适当插入 B-roll'],['字幕要求','全程字幕'],['钩子要求','先抛出结果']],remark:'成品已提交，请运营直接通过或驳回。',file:'成品预览.mp4'}];
let selected=0;function renderList(){document.querySelector('#list').innerHTML=tickets.map((t,i)=>`<div class="ticket ${i===selected?'active':''}" onclick="selectTicket(${i})"><div class="ticket-top"><span class="ticket-no">${t.no}</span><span class="badge">${t.status}</span></div><div class="ticket-meta"><span>学员：${t.student}</span><span>账号：${t.account}</span><span>提交人：${t.submitter}</span><span>截止：${t.deadline}</span></div></div>`).join('')}function renderDetail(){const t=tickets[selected];document.querySelector('#detail').innerHTML=`<div class="detail-head"><div><h1>${t.no}</h1><p>${t.student} · ${t.account} · ${t.platform}</p></div><span class="status">${t.status}</span></div><div class="grid"><div class="fact"><label>提交人</label><b>${t.submitter}</b></div><div class="fact"><label>截止时间</label><b>${t.deadline}</b></div><div class="fact"><label>账号平台</label><b>${t.platform}</b></div><div class="fact"><label>工单类型</label><b>剪辑 / 拍摄</b></div></div><section class="section"><h2>账号资料</h2><div class="account"><div class="cover">${t.cover}</div><div class="account-info"><div><span>账号名称</span><b>${t.account}</b></div><div><span>主页链接</span><a class="link" href="${t.link}" target="_blank">${t.link}</a></div><div><span>说明</span><b>创建工单时冻结的账号快照</b></div></div></div></section><section class="section"><h2>运营填写内容</h2><div class="fields">${t.fields.map(x=>`<div class="field"><label>${x[0]}</label><b>${x[1]}</b></div>`).join('')}</div></section><section class="section"><h2>工单附件</h2><div class="attachment"><div class="file"><span class="file-icon">↗</span><span>${t.file}</span></div><button class="btn">预览 / 下载</button></div></section><section class="section"><h2>运营备注</h2><div class="remark">${t.remark}</div></section><div class="actions"><span class="actions-title">操作区</span><button class="btn">开始制作</button><button class="btn primary">提交成品</button><button class="btn primary">通过</button><button class="btn danger">驳回</button><span class="hint">驳回需要填写理由，通过理由可选</span></div>`}function selectTicket(i){selected=i;renderList();renderDetail()}renderList();renderDetail();</script>
</body></html>
